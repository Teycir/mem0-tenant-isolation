services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: mem0pg
    environment:
      POSTGRES_PASSWORD: pgpass
      POSTGRES_USER: postgres
    ports:
      - "8432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
